name: Deploy (opt-in)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  validate:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  images:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize registry repository
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          target: production
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
  release:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Require configured hosting credentials
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
      - name: Verified SSH, immutable images, one-off migration, readiness gate
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/bike-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/bike-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/bike-ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/bike-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/bike-ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -se -- '$RELEASE_SHA' 'ghcr.io/${GITHUB_REPOSITORY,,}'" <<'REMOTE'
          set -euo pipefail
          cd /opt/will-there-be-a-bike
          test -z "$(git status --porcelain)"
          git fetch origin "$1"
          git switch --detach "$1"
          export BIKE_IMAGE_TAG="$1" BIKE_IMAGE_PREFIX="$2"
          docker compose -f compose.prod.yml -f compose.release.yml pull backend web
          docker compose -f compose.prod.yml -f compose.release.yml up -d --wait db
          docker compose -f compose.prod.yml -f compose.release.yml run --rm --no-deps backend alembic upgrade head
          docker compose -f compose.prod.yml -f compose.release.yml up -d --no-build --wait --wait-timeout 120
          REMOTE
