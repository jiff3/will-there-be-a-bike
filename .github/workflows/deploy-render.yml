name: Deploy Render (owner opt-in)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-production-release
  cancel-in-progress: false
jobs:
  validate:
    if: vars.RENDER_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c backend/constraints.txt httpx
      - name: Deploy tested commit, poll actual release, verify HTTPS frontend/API/model
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RELEASE_SHA: ${{ github.sha }}
          APP_PUBLIC_ORIGIN: ${{ vars.APP_PUBLIC_ORIGIN }}
        run: python scripts/render_deploy.py
