[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "will-there-be-a-bike-api"
version = "0.1.0"
description = "API for bike-share availability forecasting"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi==25.1.0",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "tzdata>=2024.1",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=2.0,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
inference = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "lightgbm==4.6.0",
]
ml = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "lightgbm==4.6.0",
  "matplotlib==3.10.8",
  "psutil==7.2.2",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov==6.3.0",
  "ruff>=0.6,<1",
]
performance = ["locust==2.35.0", "psutil==7.2.2"]

[project.scripts]
bike-data = "app.modules.ingestion.cli:main"
bike-ml = "app.modules.ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgis: requires an isolated migrated PostgreSQL/PostGIS database"]

[tool.coverage.run]
source = ["app"]
omit = ["app/modules/ml/artifacts/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 75

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "lightgbm.*", "matplotlib.*", "psutil.*"]
ignore_missing_imports = true

